<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Band Week</title>
  <meta name="description" content="Three short resistance-band routines. Do each once a week, any day, any order.">

  <!-- Theme colours (dark by default, light when the system is light) -->
  <meta name="theme-color" content="#1a1220" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f6f1f8" media="(prefers-color-scheme: light)">
  <meta name="color-scheme" content="dark light">

  <!-- PWA + iOS home screen -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Band Week">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Fonts (cached by the service worker; system fonts are used if they can't load) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- 1. Home -->
  <main id="home" class="screen">
    <header class="home-head">
      <h1>Band Week</h1>
      <p class="tagline">Three short routines. Do each once a week, any day, any order.</p>
    </header>

    <div class="tabs" role="tablist" aria-label="Routines" id="tabs"></div>

    <section id="panel" class="panel" role="tabpanel" aria-labelledby="">
      <p class="equipment" id="equipment"></p>
      <p class="note" id="note" hidden></p>
      <ol class="moves" id="moves"></ol>
    </section>

    <div class="start-wrap">
      <button class="btn btn-primary btn-start" id="start">Start</button>
    </div>
  </main>

  <!-- 2. Timer -->
  <section id="timer" class="screen" hidden>
    <header class="t-bar">
      <button class="icon-btn" id="stop" aria-label="End workout">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <p class="t-routine" id="t-routine"></p>
      <p class="t-left" id="t-left"></p>
    </header>

    <!-- Timeline: one segment per interval, for this workout only -->
    <div class="timeline" id="timeline" role="progressbar" aria-label="Workout progress"
         aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
    <p class="position" id="position"></p>

    <div class="dial">
      <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
        <circle class="ring-track" cx="60" cy="60" r="54"/>
        <circle class="ring-fill" id="ring" cx="60" cy="60" r="54"/>
      </svg>
      <div class="dial-inner">
        <p class="phase" id="phase">Get ready</p>
        <div class="count" id="count" aria-hidden="true">10</div>
      </div>
    </div>

    <div class="move-info">
      <h2 class="move-name" id="t-name"></h2>
      <p class="band-label" id="t-band" hidden></p>
      <div class="move-body">
        <div class="setup" id="t-pic" role="img"></div>
        <div>
          <p class="move-cue" id="t-cue"></p>
          <a class="demo" id="t-demo" target="_blank" rel="noopener">Watch a demo</a>
        </div>
      </div>
    </div>

    <div class="next-card" id="next-card" hidden>
      <span class="next-label">Up next</span>
      <span class="next-name" id="t-then"></span>
    </div>

    <div class="controls">
      <button class="ctrl" id="back" aria-label="Back to previous move">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path class="solid" d="M7 6h2v12H7zM19 6v12l-9-6z"/></svg>
        <span>Back</span>
      </button>
      <button class="ctrl ctrl-main" id="pause" aria-label="Pause">
        <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path class="solid" d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
        <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true" hidden><path class="solid" d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="ctrl" id="skip" aria-label="Skip to next">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path class="solid" d="M15 6h2v12h-2zM5 6v12l9-6z"/></svg>
        <span>Skip</span>
      </button>
    </div>
    <p class="sr-only" id="announce" aria-live="polite"></p>
  </section>

  <!-- "Are you sure?" before ending a workout -->
  <dialog id="confirm-end" class="sheet" aria-labelledby="confirm-title">
    <form method="dialog">
      <h2 id="confirm-title">End this workout?</h2>
      <p>The timer is paused. You can pick up where you left off, or end it here.</p>
      <div class="sheet-actions">
        <button class="btn btn-primary" value="keep" autofocus>Keep going</button>
        <button class="btn btn-ghost" value="end">End workout</button>
      </div>
    </form>
  </dialog>

  <!-- 3. Done -->
  <section id="done" class="screen" hidden>
    <div class="done-body">
      <h2 class="done-title" id="done-title"></h2>
      <p class="done-sub">That's this one covered for the week.</p>
    </div>
    <button class="btn btn-primary btn-start" id="close">Close</button>
  </section>

  <script src="poses.js"></script>
  <script src="app.js"></script>
</body>
</html>
